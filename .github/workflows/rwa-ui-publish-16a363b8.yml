name: Verify and prepare RWA UI patch on staging
on:
  push:
    branches: [rwa-ui-publish-20260930-16a363b8]
    paths: [.github/workflows/rwa-ui-publish-16a363b8.yml]
permissions:
  contents: write
jobs:
  publish-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply and validate exact delivered sources
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python .rwa-ui-publication/apply.py
      - name: Commit prepared files to staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rwa_latest
          git diff --cached --stat
          git commit -m 'Prepare exact Run report loading and Group ID patches'
          git push origin HEAD:refs/heads/rwa-ui-publish-20260930-16a363b8
