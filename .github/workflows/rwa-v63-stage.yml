name: Verify and stage RWA v6.3 semantic generalization
on:
  push:
    branches: [rwa-semantic-generalization-v6-3]
    paths:
      - '.rwa-v63-transfer/**'
      - '.github/workflows/rwa-v63-stage.yml'
permissions:
  contents: write
jobs:
  apply-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify immutable payload and apply reviewed source
        run: |
          python - <<'PY'
          import gzip, hashlib, json, subprocess
          from pathlib import Path
          BASE='40583d4ede04e9d6eaae74b1bc98bb1d21e67f95'
          parts=sorted(Path('.rwa-v63-transfer').glob('part*.gzpart'), key=lambda p:int(p.stem.replace('part','').replace('.gzpart','')))
          assert len(parts)==8, parts
          blob=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(blob).hexdigest()=='e1225c26e928afb602171d30eba72ad71c4eff86afa0e3037630d1426e8fd242'
          payload=json.loads(gzip.decompress(blob))
          assert payload['base']==BASE
          subprocess.run(['git','merge-base','--is-ancestor',BASE,'HEAD'],check=True)
          for name,content in payload['files'].items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and name.startswith('rwa_latest/')
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8',newline='\n')
          Path('/tmp/rwa-v63-payload.json').write_text(json.dumps(payload),encoding='utf-8')
          print('Applied',len(payload['files']),'reviewed source files.')
          PY
      - name: Rebuild generated rules and standalone
        working-directory: rwa_latest
        run: |
          python build_command_patterns.py
          python tools/build_standalone.py
      - name: Verify generated bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('/tmp/rwa-v63-payload.json').read_text())
          for name,digest in p['expected_generated'].items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==digest,(name,actual,digest)
          print('Generated artifacts match locally reviewed release.')
          PY
      - name: Full regression gate
        working-directory: rwa_latest
        run: npm test
      - name: Publish verified source to feature branch
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('/tmp/rwa-v63-payload.json').read_text())
          paths=sorted(p['files'])+sorted(p['expected_generated'])
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(rwa): add deterministic semantic generalization v6.3'
          git push origin HEAD:refs/heads/rwa-semantic-generalization-v6-3
      - name: Archive exact source and synthetic evidence
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=zip HEAD:rwa_latest > evidence/rwa-source.zip
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwa-v63-source-and-evidence
          path: |
            evidence/
            rwa_latest/reports/test_runs.json
            rwa_latest/reports/v6_existing_questions.json
            rwa_latest/reports/v6_existing_robustness.json
            rwa_latest/reports/composition*.json
            rwa_latest/reports/semantic_planning_tests.json
            rwa_latest/reports/semantic_generalization_tests.json
            rwa_latest/reports/planning_properties.json
          retention-days: 7
