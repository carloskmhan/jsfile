name: Apply verified RWA source patch once
on:
  push:
    branches: [rwa-composition-v6]
    paths: ['.rwa-staging/**']
permissions:
  contents: read
jobs:
  apply-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify immutable transport and apply reviewed source
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path,PurePosixPath
          expected='0c601702cbe8ff1ba9c20fbecffa74906a0b0afbd38d07c8a4aed050c8669921'
          parts=sorted(Path('.rwa-staging').glob('chunk*.txt'))
          assert len(parts)==4
          raw=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()==expected,'Transport checksum mismatch'
          source=lzma.decompress(raw)
          assert len(source)<2000000
          payload=json.loads(source)
          tree=subprocess.check_output(['git','rev-parse','HEAD:rwa_latest'],text=True).strip()
          assert tree==payload['base_subtree'],'Source advanced; do not overwrite'
          assert len(payload['files'])==28
          for name in [*payload['files'],*payload['protected']]:
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and not name.startswith('.')
          temp=Path(os.environ['RUNNER_TEMP'])
          patch=temp/'composition.patch';patch.write_text(payload['patch'],encoding='utf-8')
          (temp/'composition-manifest.json').write_text(json.dumps(payload),encoding='utf-8')
          subprocess.run(['git','apply','--check','--directory=rwa_latest',str(patch)],check=True)
          subprocess.run(['git','apply','--directory=rwa_latest',str(patch)],check=True)
          PY
      - name: Rebuild generated files from pinned canonical sources
        run: |
          mkdir -p "$RUNNER_TEMP/rwa-baseline"
          git archive af44159f4ce854833eee1611b24b52b1b65f9100:rwa_latest | tar -x -C "$RUNNER_TEMP/rwa-baseline"
          cd rwa_latest
          python build_command_patterns.py
          python tools/build_composition_cases.py
          node tools/composition_regression.mjs --capture-baseline --baseline-root "$RUNNER_TEMP/rwa-baseline"
          python tools/build_standalone.py
      - name: Match all source and generated bytes to locally tested release
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'composition-manifest.json').read_text())
          for name,expected in {**data['files'],**data['protected']}.items():
              actual=hashlib.sha256((Path('rwa_latest')/name).read_bytes()).hexdigest()
              assert actual==expected,'Checksum mismatch: '+name
          print('All 28 release files and 7 protected files match verified local bytes.')
          PY
      - name: Full existing and new regression gate
        working-directory: rwa_latest
        run: npm test
      - name: Publish only verified source files to isolated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'composition-manifest.json').read_text())
          files=['rwa_latest/'+name for name in data['files']]
          subprocess.run(['git','add','--',*files],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(staged)==sorted(files),'Unexpected staged paths'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(rwa): add guarded compositional semantics and verified regression gate'],check=True)
          auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          print('::add-mask::'+auth,flush=True)
          env={**os.environ,'RWA_GIT_AUTH_HEADER':'AUTHORIZATION: basic '+auth}
          subprocess.run(['git','--config-env=http.https://github.com/.extraheader=RWA_GIT_AUTH_HEADER','push','origin','HEAD:refs/heads/rwa-composition-v6'],check=True,env=env)
          PY
      - name: Archive exact committed source and synthetic evidence
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=zip HEAD:rwa_latest > evidence/rwa-source.zip
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwa-source-and-evidence
          path: |
            evidence/
            rwa_latest/reports/test_runs.json
            rwa_latest/reports/v6_existing_questions.json
            rwa_latest/reports/v6_existing_robustness.json
            rwa_latest/reports/composition*.json
          retention-days: 7
